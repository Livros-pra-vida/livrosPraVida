<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novidades & Lançamentos - Livros pra Vida</title>
    <link rel="icon" type="image/png" href="../imagens/icone.png">
    <link rel="stylesheet" href="../css/StyleNovidades.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/tema.css">
    <script src="../js/lpv.js"></script>
</head>
<body>
    <header style="display: flex; flex-direction: column; background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 100; width: 100%; padding: 12px 16px; gap: 12px;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <a href="../index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #2d251e; font-weight: 700; font-size: 1.15rem;">
                <img src="../imagens/icone.png" alt="Logo Livros pra Vida" style="width: 32px; height: 32px; border-radius: 6px; object-fit: cover;">
                <span>Livros pra Vida</span>
            </a>

            <div style="display: flex; align-items: center; gap: 14px;">
                <a href="Carrinho.html" title="Ver Carrinho" style="position: relative; color: #2d251e; display: flex; align-items: center; text-decoration: none;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="contadorCarrinhoHeader" style="position: absolute; top: -4px; right: -6px; background-color: #8c533e; color: #fff; font-size: 0.65rem; font-weight: 700; padding: 2px 5px; border-radius: 10px; display: none;">0</span>
                </a>

                <div id="areaAuthHeader" style="display: flex; align-items: center; gap: 8px;"></div>
            </div>
        </div>

        <nav style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 16px; width: 100%; padding-top: 2px;">
            <a href="Catalogo.html" style="text-decoration: none; color: #2d251e; font-weight: 500; font-size: 0.88rem;">Catálogo</a>
            <a href="ComprarTrocar.html" style="text-decoration: none; color: #2d251e; font-weight: 500; font-size: 0.88rem;">Comprar & Trocar</a>
            <a href="Novidades.html" style="text-decoration: none; color: #8c533e; font-weight: 700; font-size: 0.88rem;">Novidades</a>
            <a href="Chat.html" style="text-decoration: none; color: #2d251e; font-weight: 500; font-size: 0.88rem;">Chat & Comunidade</a>
            <a href="SobreNos.html" style="text-decoration: none; color: #2d251e; font-weight: 500; font-size: 0.88rem;">Sobre Nós</a>
        </nav>

    </header>

    <main class="container">
        <div class="novidades-topo">
            <div>
                <h1>Novidades, Lançamentos & Mangás</h1>
                <p style="color: #666;">Notícias do mercado literário e otaku selecionadas pela equipe do Livros pra Vida.</p>
            </div>
            <!-- Só aparece para administradores (a API também confere) -->
            <button type="button" id="btnPublicar" class="btn-publicar" style="display:none" onclick="abrirFormulario()">+ Publicar novidade</button>
        </div>

        <div class="novidades-tabs">
            <button class="tab-novidade active" onclick="filtrarNoticias('todos', event)">Todos</button>
            <button class="tab-novidade" onclick="filtrarNoticias('livros', event)">Livros & Prêmios</button>
            <button class="tab-novidade" onclick="filtrarNoticias('mangas', event)">Mangás & Hiatos</button>
            <button class="tab-novidade" onclick="filtrarNoticias('adaptacoes', event)">Adaptações (Filmes/Séries)</button>
        </div>

        <div class="layout-novidades-principal">
            <div class="coluna-noticias">
                <div id="bannerDestaque"></div>
                <div class="novidades-grid" id="gradeNoticias">
                    <div class="lpv-esqueleto" style="height: 320px;"></div>
                    <div class="lpv-esqueleto" style="height: 320px;"></div>
                </div>
            </div>

            <aside class="sidebar-lancamentos">
                <h3>Próximos Lançamentos</h3>
                <div id="listaLancamentos"><div class="lpv-esqueleto" style="height: 60px;"></div></div>
                <button type="button" id="btnNovoLancamento" class="btn-lancamento" style="display:none" onclick="abrirFormulario(null, 'lancamento')">+ Adicionar lançamento</button>
            </aside>
        </div>
    </main>

    <!-- Formulário de publicação (somente administrador) -->
    <div id="modalNoticia" class="modal-noticia" style="display:none" role="dialog" aria-modal="true" aria-labelledby="tituloModalNoticia">
        <form id="formNoticia" class="modal-caixa" onsubmit="salvarNoticia(event)">
            <button type="button" class="modal-fechar" onclick="fecharFormulario()" aria-label="Fechar">✕</button>
            <h3 id="tituloModalNoticia">Publicar novidade</h3>

            <div class="campo-linha">
                <label>Tipo
                    <select id="nKind" onchange="ajustarTipo()">
                        <option value="noticia">Notícia</option>
                        <option value="lancamento">Próximo lançamento</option>
                    </select>
                </label>
                <label>Categoria
                    <select id="nCategory">
                        <option value="livros">Livros & Prêmios</option>
                        <option value="mangas">Mangás & Hiatos</option>
                        <option value="adaptacoes">Adaptações</option>
                    </select>
                </label>
            </div>
            <label>Título <input id="nTitle" required maxlength="200" placeholder="Ex: Prêmio Jabuti anuncia finalistas"></label>
            <label><span id="rotuloResumo">Resumo</span> <textarea id="nSummary" rows="3" maxlength="1000" placeholder="Um parágrafo curto sobre a notícia"></textarea></label>
            <label class="so-lancamento">Data do lançamento <input id="nReleaseDate" type="date"></label>
            <div class="so-noticia">
                <div class="campo-linha">
                    <label>Fonte <input id="nSourceName" maxlength="120" placeholder="Ex: Portal PublishNews"></label>
                    <label>Link da matéria <input id="nSourceUrl" type="url" maxlength="500" placeholder="https://..."></label>
                </div>
                <label>Imagem (link https) <input id="nImageUrl" type="url" placeholder="https://..."></label>
                <label class="caixa-check"><input id="nFeatured" type="checkbox"> Destaque da semana (substitui o destaque atual)</label>
            </div>
            <p id="nErro" class="erro-form" role="alert"></p>
            <button type="submit" class="btn-publicar" id="btnSalvarNoticia">Publicar</button>
        </form>
    </div>

    <script>
        const CATEGORIAS = { livros: "Livros & Prêmios", mangas: "Mangás & Hiatos", adaptacoes: "Adaptações" };
        const IMAGEM_PADRAO = "https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400&auto=format&fit=crop&q=60";
        const MESES = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
        let noticias = [];
        let lancamentos = [];
        let categoriaAtual = "todos";
        let editandoId = null;

        function ehAdmin() {
            return LPV.logado() && localStorage.getItem("isAdmin") === "true";
        }

        document.addEventListener("DOMContentLoaded", function () {
            atualizarCabecalhoAuth();
            LPV.carrinho.pintarContador();
            if (ehAdmin()) {
                document.getElementById("btnPublicar").style.display = "inline-block";
                document.getElementById("btnNovoLancamento").style.display = "block";
            }
            carregarNovidades();
        });

        // Busca as notícias e os lançamentos publicados pelos administradores (GET /news_posts).
        async function carregarNovidades() {
            try {
                const dados = await LPV.chamar("/news_posts");
                noticias = dados.noticias;
                lancamentos = dados.lancamentos;
                desenharNoticias();
                desenharLancamentos();
            } catch (erro) {
                document.getElementById("gradeNoticias").innerHTML =
                    `<div class="lpv-vazio" style="grid-column: 1/-1;"><strong>Não foi possível carregar as novidades</strong>
                     ${LPV.esc(erro.message)}<br><br><button class="btn-externo" onclick="carregarNovidades()">Tentar de novo</button></div>`;
                document.getElementById("listaLancamentos").innerHTML = "";
            }
        }

        // Botões de editar/apagar (só para administrador).
        function botoesAdmin(n) {
            if (!ehAdmin()) return "";
            const autor = n.published_by ? `por ${LPV.esc(n.published_by.name)}` : "conteúdo original";
            return `<div class="admin-acoes">
                        <small>${autor}</small>
                        <button type="button" onclick="abrirFormulario(${Number(n.id)})">Editar</button>
                        <button type="button" class="perigo" onclick="apagarNoticia(${Number(n.id)})">Apagar</button>
                    </div>`;
        }

        function linkMateria(n) {
            return n.source_url
                ? `<a href="${LPV.esc(n.source_url)}" target="_blank" rel="noopener noreferrer" class="btn-externo">Ler Matéria Completa</a>`
                : "";
        }

        function desenharNoticias() {
            const visiveis = noticias.filter(n => categoriaAtual === "todos" || n.category === categoriaAtual);
            const destaque = visiveis.find(n => n.featured);
            const demais = visiveis.filter(n => n !== destaque);

            document.getElementById("bannerDestaque").innerHTML = destaque ? `
                <article class="banner-destaque item-novidade">
                    <img src="${LPV.esc(LPV.urlImagem(destaque.image_url, IMAGEM_PADRAO))}" alt="" onerror="this.src='${IMAGEM_PADRAO}'">
                    <div class="banner-conteudo">
                        <span class="selo-destaque">Destaque da Semana</span>
                        <span class="tag-categoria">${LPV.esc(CATEGORIAS[destaque.category])}</span>
                        <h2 style="font-size: 1.3rem; color: #2d251e;">${LPV.esc(destaque.title)}</h2>
                        <p style="font-size: 0.9rem; color: #555;">${LPV.esc(destaque.source_name || "")}</p>
                        <span class="descricao-noticia">${LPV.esc(destaque.summary || "")}</span>
                        <a href="Chat.html" class="badge-comunidade">Comente com a comunidade no Chat</a>
                        <div style="margin-top: 10px;">${linkMateria(destaque)}</div>
                        ${botoesAdmin(destaque)}
                    </div>
                </article>` : "";

            const grade = document.getElementById("gradeNoticias");
            if (visiveis.length === 0) {
                grade.innerHTML = `<div class="lpv-vazio" style="grid-column: 1/-1;"><strong>Nenhuma novidade nesta categoria</strong>
                    ${ehAdmin() ? "Clique em “+ Publicar novidade” para adicionar." : "Volte em breve!"}</div>`;
                return;
            }
            grade.innerHTML = demais.map(n => `
                <article class="item-novidade" data-categoria="${LPV.esc(n.category)}">
                    <span class="tag-categoria">${LPV.esc(CATEGORIAS[n.category])}</span>
                    <img src="${LPV.esc(LPV.urlImagem(n.image_url, IMAGEM_PADRAO))}" alt="" loading="lazy" onerror="this.src='${IMAGEM_PADRAO}'">
                    <div class="info">
                        <h3>${LPV.esc(n.title)}</h3>
                        <p>${LPV.esc(new Date(n.created_at).toLocaleDateString("pt-BR"))}</p>
                        <span class="descricao-noticia">${LPV.esc(n.summary || "")}</span>
                        <strong style="color: #8c533e; font-size: 0.9rem;">${LPV.esc(n.source_name || "")}</strong>
                    </div>
                    ${linkMateria(n)}
                    ${botoesAdmin(n)}
                </article>`).join("");
        }

        function desenharLancamentos() {
            const lista = document.getElementById("listaLancamentos");
            if (lancamentos.length === 0) {
                lista.innerHTML = '<p style="font-size: 0.85rem; color: #6e655f;">Nenhum lançamento agendado.</p>';
                return;
            }
            lista.innerHTML = lancamentos.map(l => {
                const [ano, mes, dia] = String(l.release_date).split("-");
                return `
                <div class="item-calendario">
                    <div class="data-box"><span class="dia">${Number(dia)}</span><span class="mes">${MESES[Number(mes) - 1]}</span></div>
                    <div class="info-calendario">
                        <h4>${LPV.esc(l.title)}</h4>
                        <p>${LPV.esc(l.summary || "")}</p>
                        ${botoesAdmin(l)}
                    </div>
                </div>`;
            }).join("");
        }

        function filtrarNoticias(categoria, evento) {
            document.querySelectorAll(".tab-novidade").forEach(btn => btn.classList.remove("active"));
            evento.target.classList.add("active");
            categoriaAtual = categoria;
            desenharNoticias();
        }

        // ---------- Publicar / editar / apagar (administrador) ----------
        function ajustarTipo() {
            const lancamento = document.getElementById("nKind").value === "lancamento";
            document.querySelectorAll(".so-noticia").forEach(el => el.style.display = lancamento ? "none" : "flex");
            document.querySelectorAll(".so-lancamento").forEach(el => el.style.display = lancamento ? "flex" : "none");
            document.getElementById("nReleaseDate").required = lancamento;
            document.getElementById("rotuloResumo").textContent = lancamento ? "Detalhes (editora, formato...)" : "Resumo";
        }

        function abrirFormulario(id = null, tipo = "noticia") {
            const n = [...noticias, ...lancamentos].find(x => x.id === id);
            editandoId = n ? n.id : null;
            const valores = {
                nKind: n ? n.kind : tipo, nCategory: n ? n.category : "livros", nTitle: n?.title, nSummary: n?.summary,
                nReleaseDate: n?.release_date, nSourceName: n?.source_name, nSourceUrl: n?.source_url, nImageUrl: n?.image_url
            };
            Object.entries(valores).forEach(([campo, valor]) => { document.getElementById(campo).value = valor || ""; });
            document.getElementById("nFeatured").checked = !!(n && n.featured);
            document.getElementById("tituloModalNoticia").textContent = n ? "Editar novidade" : "Publicar novidade";
            document.getElementById("btnSalvarNoticia").textContent = n ? "Salvar alterações" : "Publicar";
            document.getElementById("nErro").textContent = "";
            ajustarTipo();
            document.getElementById("modalNoticia").style.display = "flex";
            document.getElementById("nTitle").focus();
        }

        function fecharFormulario() {
            document.getElementById("modalNoticia").style.display = "none";
            editandoId = null;
        }

        async function salvarNoticia(evento) {
            evento.preventDefault();
            const valor = id => document.getElementById(id).value.trim();
            const lancamento = valor("nKind") === "lancamento";
            const news_post = {
                kind: valor("nKind"), category: valor("nCategory"), title: valor("nTitle"), summary: valor("nSummary"),
                release_date: lancamento ? valor("nReleaseDate") : null,
                source_name: lancamento ? "" : valor("nSourceName"),
                source_url: lancamento ? "" : valor("nSourceUrl"),
                image_url: lancamento ? "" : valor("nImageUrl"),
                featured: !lancamento && document.getElementById("nFeatured").checked
            };
            const botao = document.getElementById("btnSalvarNoticia");
            botao.disabled = true;
            try {
                await LPV.chamar(editandoId ? `/news_posts/${editandoId}` : "/news_posts",
                    { method: editandoId ? "PATCH" : "POST", corpo: { news_post } });
                LPV.toast(editandoId ? "Novidade atualizada!" : "Novidade publicada para todos!", "sucesso");
                fecharFormulario();
                carregarNovidades();
            } catch (erro) {
                document.getElementById("nErro").textContent = erro.message;
            } finally {
                botao.disabled = false;
            }
        }

        async function apagarNoticia(id) {
            const n = [...noticias, ...lancamentos].find(x => x.id === id);
            if (!n || !confirm(`Apagar "${n.title}" para todos os usuários?`)) return;
            try {
                await LPV.chamar(`/news_posts/${id}`, { method: "DELETE" });
                LPV.toast("Novidade apagada.", "info");
                carregarNovidades();
            } catch (erro) {
                LPV.toast(erro.message, "erro");
            }
        }

        document.addEventListener("keydown", e => { if (e.key === "Escape") fecharFormulario(); });

        // ---------- Cabeçalho ----------
        function atualizarCabecalhoAuth() {
            const areaAuth = document.getElementById("areaAuthHeader");
            if (!areaAuth) return;
            const foto = LPV.esc(LPV.urlImagem(localStorage.getItem("usuarioFoto"), "../imagens/perfil.jpg"));
            if (LPV.logado()) {
                areaAuth.innerHTML = `
                    ${ehAdmin() ? '<a href="Admin.html" style="text-decoration: none; color: #fff; background: #2d251e; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600;">Painel ADM</a>' : ""}
                    <a href="Estantes.html" style="text-decoration: none; color: #8c533e; font-size: 0.85rem; font-weight: 600;">Minhas Estantes</a>
                    <a href="#" onclick="LPV.sair(event)" style="text-decoration: none; color: #6e655f; font-size: 0.85rem; font-weight: 500;">Sair</a>
                    <a href="MeuPerfil.html" title="Meu Perfil">
                        <img src="${foto}" onerror="this.src='../imagens/perfil.jpg'" alt="Perfil" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid #8c533e;">
                    </a>`;
            } else {
                areaAuth.innerHTML = `
                    <a href="Login.html" style="text-decoration: none; color: #8c533e; font-size: 0.85rem; font-weight: 600; padding: 4px 8px;">Entrar</a>
                    <a href="Cadastro.html" style="text-decoration: none; background-color: #8c533e; color: #fff; padding: 5px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;">Cadastrar</a>`;
            }
        }
    </script>
</body>
</html>
