<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros pra Vida - Criar conta</title>

    <link rel="icon" href="../imagens/icone.png" type="image/png">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/StyleCadLog.css">
</head>

<body>

    <header>
        <a href="../index.html">
            <img src="../imagens/pngHome.png" alt="Logo Livros pra Vida">
        </a>
    </header>

    <main>

        <section>
            <div class="title">
                <h1>Criar conta</h1>
                <p>Já tem uma conta? <a href="Login.html">Entrar</a></p>
            </div>

            <form onsubmit="realizarCadastro(event)">

                <label>
                    Nome de usuário
                    <input type="text" id="cadUsuario" placeholder="ex: leitor_curioso" required>
                </label>

                <label>
                    E-mail
                    <input type="email" id="cadEmail" placeholder="seunome@email.com" required>
                </label>

                <label>
                    Data de Nascimento
                    <input type="date" id="cadNascimento" required>
                </label>

                <label>
                    CPF (somente números)
                    <input type="text" id="cadCpf" placeholder="00000000000" maxlength="11" pattern="\d{11}"
                        title="Digite exatamente 11 números"
                        oninput="this.value = this.value.replace(/\D/g, '').slice(0, 11)" required>
                </label>

                <label>
                    Telefone (com DDD, somente números)
                    <input type="tel" id="cadTelefone" placeholder="61999998888" maxlength="11"
                        oninput="this.value = this.value.replace(/\D/g, '').slice(0, 11)" required>
                </label>

                <label>
                    Senha
                    <div class="password">
                        <input type="password" id="cadSenha" placeholder="Mínimo 8 caracteres" required minlength="8">
                        <button type="button" id="btnOlhoSenha"
                            onclick="alternarVisibilidade('cadSenha', 'iconeOlhoSenha')">
                            <svg id="iconeOlhoSenha" viewBox="0 0 24 24">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                </path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </label>

                <label>
                    Confirmar senha
                    <div class="password">
                        <input type="password" id="cadConfirmaSenha" placeholder="Repita a senha" required>
                        <button type="button" id="btnOlhoConfirma"
                            onclick="alternarVisibilidade('cadConfirmaSenha', 'iconeOlhoConfirma')">
                            <svg id="iconeOlhoConfirma" viewBox="0 0 24 24">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                </path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </label>

                <label class="terms">
                    <input type="checkbox" id="aceitoTermos" required>
                    <span>
                        Li e concordo com os
                        <a href="#">Termos de Uso</a> e a
                        <a href="#">Política de Privacidade</a>.
                    </span>
                </label>

                <button class="register" type="submit">
                    Concluir
                </button>

            </form>

            <script>
                function alternarVisibilidade(inputId, iconeId) {
                    const campo = document.getElementById(inputId);
                    const icone = document.getElementById(iconeId);

                    if (campo.type === "password") {
                        campo.type = "text";
                        icone.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
                    } else {
                        campo.type = "password";
                        icone.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
                    }
                }

                async function realizarCadastro(event) {
                    event.preventDefault();

                    const nome = document.getElementById("cadUsuario").value.trim();
                    const email = document.getElementById("cadEmail").value.trim();
                    const senha = document.getElementById("cadSenha").value;
                    const confirmaSenha = document.getElementById("cadConfirmaSenha").value;
                    const telefone = document.getElementById("cadTelefone").value.trim();
                    const cpf = document.getElementById("cadCpf").value.trim();
                    const nascimento = document.getElementById("cadNascimento").value;

                    if (senha !== confirmaSenha) {
                        alert("As senhas não coincidem.");
                        return;
                    }

                    try {
                        const resposta = await fetch("https://lpv-api.onrender.com/users", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                user: {
                                    username: nome,
                                    email: email,
                                    password: senha,
                                    password_confirmation: confirmaSenha,
                                    telefone: telefone,
                                    cpf: cpf,
                                    nascimento: nascimento,
                                }
                            })
                        });

                        const dados = await resposta.json();

                        if (resposta.ok) {
                            alert("Cadastro realizado com sucesso!");

                            const usuario = dados.user || dados;

                            localStorage.setItem("usuario", JSON.stringify(usuario));
                            localStorage.setItem("logado", "true");
                            localStorage.setItem("usuarioLogado", usuario.username || email);
                            localStorage.setItem("usuarioNome", usuario.username || nome);
                            localStorage.setItem("usuarioEmail", usuario.email || email);

                            if (dados.token) {
                                localStorage.setItem("token", dados.token);
                            }

                            window.location.href = "../index.html";
                        } else {
                            console.error("Erro no cadastro:", dados);
                            alert(
                                "Não foi possível realizar o cadastro: " +
                                (dados.errors ? dados.errors.join(", ") : dados.error || "Verifique os dados informados.")
                            );
                        }

                    } catch (erro) {
                        console.error(erro);
                        alert("❌ Não foi possível conectar com a API.");
                    }
                }
            </script>

        </section>

        <footer>
            <p>"Toda história começa com uma página."</p>
            <div class="benefits">
                <span>✓ Acesso ilimitado ao catálogo</span>
                <span>✓ Recomendações personalizadas</span>
                <span>✓ Chat com outros leitores</span>
            </div>
            <small>© 2026 Livros pra Vida</small>
        </footer>

    </main>

</body>

</html>
