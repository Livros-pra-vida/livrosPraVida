<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Livros pra Vida</title>

    <link rel="icon" type="image/png" href="../imagens/icone.png">
    <link rel="stylesheet" href="../css/StyleCadLog.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <a href="../index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
            <img src="../imagens/icone.png" alt="Logo Livros pra Vida">
            <span>Livros pra Vida</span>
        </a>
    </header>

    <main>
        <section>
            <div class="title">
                <h1>Criar conta</h1>
                <p>Já tem uma conta? <a href="Login.html">Entrar</a></p>
            </div>

            <form id="formCadastro">
                <label>
                    Nome de usuário
                    <input type="text" id="username" required placeholder="Digite seu nome de usuário">
                </label>

                <label>
                    E-mail
                    <input type="email" id="email" required placeholder="seuemail@exemplo.com">
                </label>

                <label>
                    CPF (somente números)
                    <input type="text" id="cpf" required maxlength="11" placeholder="00000000000">
                </label>

                <label>
                    Senha
                    <div class="password">
                        <input type="password" id="senha" required placeholder="Crie uma senha segura">
                        <button type="button" onclick="alternarSenha('senha')">👁️</button>
                    </div>
                </label>

                <label>
                    Confirmar senha
                    <div class="password">
                        <input type="password" id="confirmarSenha" required placeholder="Repita a senha">
                        <button type="button" onclick="alternarSenha('confirmarSenha')">👁️</button>
                    </div>
                </label>

                <label class="terms">
                    <input type="checkbox" id="termos" required>
                    Li e concordo com os Termos de Uso e a Política de Privacidade.
                </label>

                <button type="submit" class="register" id="btnSubmit">Concluir</button>
            </form>
        </section>

        <footer>
            <p>"Toda história começa com uma página."</p>
            <div class="benefits">
                <span>✓ Acesso ilimitado ao catálogo</span>
                <span>✓ Recomendações personalizadas</span>
                <span>✓ Chat com outros leitores</span>
            </div>
            <small>© 2026 Livros pra Vida. Todos os direitos reservados.</small>
        </footer>
    </main>

    <script>
        const API_URL = "https://lpv-api.onrender.com";

        function alternarSenha(id) {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        }

        document.getElementById("formCadastro").addEventListener("submit", async function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const cpf = document.getElementById("cpf").value.trim().replace(/\D/g, '');
            const senha = document.getElementById("senha").value;
            const confirmarSenha = document.getElementById("confirmarSenha").value;
            const btnSubmit = document.getElementById("btnSubmit");

            if (cpf.length !== 11) {
                alert("❌ O CPF precisa conter exatamente 11 números.");
                return;
            }

            if (senha !== confirmarSenha) {
                alert("❌ As senhas não coincidem!");
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "Cadastrando...";

            try {
                const response = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user: {
                            username: username,
                            email: email,
                            cpf: cpf,
                            password: senha,
                            password_confirmation: confirmarSenha
                        }
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert("🎉 Conta criada com sucesso! Faça login para continuar.");
                    window.location.href = "Login.html";
                } else {
                    const erros = data.errors ? data.errors.join(", ") : (data.error || "Verifique os dados digitados.");
                    alert("❌ Erro ao criar conta: " + erros);
                }
            } catch (error) {
                console.error("Erro no cadastro:", error);
                alert("❌ Não foi possível conectar ao servidor. Verifique a conexão com a API.");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Concluir";
            }
        });
    </script>
</body>

</html>
