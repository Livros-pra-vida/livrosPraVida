<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros pra Vida - Criar conta</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/StyleCadLog.css">
</head>

<body>

    <header>
        <a href="../index.html">
            <img src="../imagens/pngHome.png">
        </a>
    </header>

    <main>

        <section>
            <div class="title">
                <h1>Criar conta</h1>
                <p>Já tem uma conta? <a href="Login.html">Entrar</a></p>
            </div>

            <form onsubmit="enviarMensagem()" action="../index.html">

                <label>
                    Nome de usuário
                    <input type="text" placeholder="ex: leitor_curioso">
                </label>

                <label>
                    E-mail
                    <input type="email" placeholder="seunome@email.com">
                </label>

                <label>
                    Senha
                    <div class="password">
                        <input type="password" placeholder="Mínimo 8 caracteres">
                        <button type="button">
                            <img src="https://www.figma.com/api/mcp/asset/ea881bc4-4cca-463d-89fe-136bc6582d27.svg">
                        </button>
                    </div>
                </label>

                <label>
                    Confirmar senha
                    <div class="password">
                        <input type="password" placeholder="Repita a senha">
                        <button type="button">
                            <img src="https://www.figma.com/api/mcp/asset/ea881bc4-4cca-463d-89fe-136bc6582d27.svg">
                        </button>
                    </div>
                </label>

                <label class="terms">
                    <input type="checkbox">
                    <span>
                        Li e concordo com os
                        <a href="#">Termos de Uso</a>
                        e a
                        <a href="#">Política de Privacidade</a>.
                    </span>
                </label>

                <button class="register" type="submit">
                    Concluir
                </button>

            </form>
            <script>
                function enviarMensagem() {
                    sessionStorage.setItem("mensagem", "Login realizado com sucesso!");
                    localStorage.setItem("logado", "true");
                    window.location.href = "index.html";
                }
            </script>
        </section>

        <footer>
            <p>"Toda história começa com uma página."</p>

            <div class="benefits">
                <span>✓ Acesso ilimitado ao catálogo</span>
                <span>✓ Recomendações personalizadas</span>
                <span>✓ Chat com outros leitores</span>
            </div>

            <small>© 2026 Livros pra Vida</small>
        </footer>

    </main>

</body>

</html>
