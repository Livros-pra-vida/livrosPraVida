    <script type="module">
        import { createConsumer } from "https://esm.sh/@rails/actioncable@7";

        const API = "https://lpv-api.onrender.com";
        const TOKEN_KEY = "token"; // CONFIRMAR: nome da chave do localStorage onde o login guarda o token

        const list = document.getElementById("messages");
        const form = document.getElementById("form");
        const input = document.getElementById("input");
        const aviso = document.getElementById("avisoGlobal");

        function mostrarAviso(texto) {
            aviso.textContent = texto;
            aviso.style.display = "block";
        }

        function addMessage(m) {
            const div = document.createElement("div");
            div.className = "msg";
            const nome = document.createElement("strong");
            nome.textContent = m.username + ": ";
            const texto = document.createElement("span");
            texto.textContent = m.content; // textContent pra xss
            div.append(nome, texto);
            list.append(div);
            list.scrollTop = list.scrollHeight;
        }

        const token = localStorage.getItem(TOKEN_KEY);

        if (!token) {
            mostrarAviso(localStorage.getItem("usuario")
                ? "Para usar o chat global, saia e entre novamente na sua conta."
                : "Faça login para ler e participar do chat global.");
            form.addEventListener("submit", (e) => {
                e.preventDefault();
                window.location.href = "Login.html";
            });
        } else {
            // Histórico recente (a API pode demorar até 60s para acordar se passar de 15 minutos sem requisição)
            mostrarAviso("Conectando ao chat...");
            try {
                const res = await fetch(`${API}/messages`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (res.ok) {
                    (await res.json()).forEach(addMessage);
                    aviso.style.display = "none";
                } else if (res.status === 401) {
                    // token expirado ou inválido: limpa e manda para o login
                    localStorage.removeItem(TOKEN_KEY);
                    mostrarAviso("Sua sessão expirou. Redirecionando para o login...");
                    setTimeout(() => { window.location.href = "Login.html"; }, 1500);
                } else {
                    mostrarAviso("Não foi possível carregar o histórico (erro " + res.status + ").");
                }
            } catch (e) {
                console.error("Histórico indisponível:", e);
                mostrarAviso("Servidor indisponível no momento. Tente novamente em instantes.");
            }

            // Tempo real
            const consumer = createConsumer(
                `${API.replace("https", "wss")}/cable?token=${encodeURIComponent(token)}`
            );
            const canal = consumer.subscriptions.create("ChatChannel", {
                received: addMessage
            });

            form.addEventListener("submit", (e) => {
                e.preventDefault();
                const content = input.value.trim();
                if (!content) return;
                canal.perform("speak", { content });
                input.value = "";
            });
        }
    </script>

    <script>
        let destinatarioAtual = null;
        let livroAtual = null;

        // O site considera "logado" quem tem o objeto "usuario" salvo (mesma regra do index.html e MeuPerfil)
        function getUsuario() {
            try { return JSON.parse(localStorage.getItem("usuario")); } catch (e) { return null; }
        }
        function estaLogado() { return !!getUsuario(); }
        function nomeUsuario() {
            const u = getUsuario();
            return (u && (u.username || u.usuario || u.nome)) || localStorage.getItem("usuarioNome") || "Eu";
        }

        // Escapa texto antes de colocar em innerHTML (evita XSS)
        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        document.addEventListener("DOMContentLoaded", function () {
            if (estaLogado()) {
                document.getElementById("entrar").style.display = "none";
                document.getElementById("cadastrar").style.display = "none";
                document.getElementById("meuPerfil").style.display = "flex";
                document.getElementById("sair").style.display = "inline-block";
                const foto = localStorage.getItem("usuarioFoto");
                if (foto) document.getElementById("menuAvatar").src = foto;
            }

            // Clique nas conversas da lista (evita onclick com aspas no HTML)
            document.getElementById("listaConversas").addEventListener("click", function (e) {
                const item = e.target.closest("[data-chave]");
                if (!item) return;
                const conversas = JSON.parse(localStorage.getItem("chatsPrivados")) || {};
                const c = conversas[item.dataset.chave];
                if (c) abrirChatPrivado(c.destinatario, c.livro);
            });

            // Parâmetros vindos do Comprar & Trocar
            const urlParams = new URLSearchParams(window.location.search);
            const msgAutomatica = urlParams.get('msg');
            const livroParam = urlParams.get('livro');
            const destinatarioParam = urlParams.get('destinatario');

            if (livroParam && destinatarioParam) {
                livroAtual = decodeURIComponent(livroParam);
                destinatarioAtual = decodeURIComponent(destinatarioParam);

                salvarConversaNoHistorico(destinatarioAtual, livroAtual, msgAutomatica);
                trocarAba('privado');
                abrirChatPrivado(destinatarioAtual, livroAtual);
            }

            carregarListaConversasPrivadas();
        });

        function trocarAba(aba) {
            document.getElementById('secaoGlobal').style.display = aba === 'global' ? 'block' : 'none';
            document.getElementById('secaoPrivado').style.display = aba === 'privado' ? 'block' : 'none';
            if (aba === 'privado') carregarListaConversasPrivadas();
        }

        // --- CHAT PRIVADO ---
        function salvarConversaNoHistorico(destinatario, livro, primeiraMsg) {
            const meuNome = nomeUsuario();
            let conversas = JSON.parse(localStorage.getItem("chatsPrivados")) || {};
            let chaveChat = `${destinatario}_${livro}`;

            if (!conversas[chaveChat]) {
                conversas[chaveChat] = {
                    destinatario: destinatario,
                    livro: livro,
                    mensagens: []
                };
                if (primeiraMsg) {
                    conversas[chaveChat].mensagens.push({ remetente: meuNome, texto: primeiraMsg });
                }
                localStorage.setItem("chatsPrivados", JSON.stringify(conversas));
            }
        }

        function carregarListaConversasPrivadas() {
            const listaEl = document.getElementById("listaConversas");
            let conversas = JSON.parse(localStorage.getItem("chatsPrivados")) || {};
            let chaves = Object.keys(conversas);

            if (chaves.length === 0) {
                listaEl.innerHTML = "";
                return;
            }

            listaEl.innerHTML = chaves.map(chave => {
                let c = conversas[chave];
                let estiloItem = (destinatarioAtual === c.destinatario && livroAtual === c.livro)
                    ? 'background: #fff; padding: 12px 15px; border: 2px solid #8c533e; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;'
                    : 'background: #fff; padding: 12px 15px; border: 1px solid #e0d7cd; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;';

                return `
                    <div style="${estiloItem}" data-chave="${esc(chave)}">
                        <div>
                            <strong style="color: #2d251e;">${esc(c.destinatario)}</strong><br>
                            <small style="color: #666;">📖 Livro: ${esc(c.livro)}</small>
                        </div>
                        <span style="font-size: 0.8rem; background: #8c533e; color: #fff; padding: 5px 10px; border-radius: 4px;">Conversar</span>
                    </div>
                `;
            }).join('');
        }

        function sair() {
            localStorage.removeItem("usuario");
            localStorage.removeItem("logado");
