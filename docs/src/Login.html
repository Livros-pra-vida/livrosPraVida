<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros pra Vida - Entrar</title>

    <link rel="icon" href="../imagens/icone.png" type="image/png">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/StyleCadLog.css">
</head>

<body>

    <header>
        <a href="../index.html">
            <img src="../imagens/pngHome.png" alt="Logo Livros pra Vida">
        </a>
    </header>

    <main>
        <section>
            <div class="title">
                <h1>Entrar</h1>
                <p>Precisa criar uma conta? <a href="Cadastro.html">Criar conta</a></p>
            </div>

            <form onsubmit="realizarLogin(event)">

                <label>
                    Nome de usuário ou e-mail
                    <input type="text" id="loginUsuario" placeholder="E-mail" required>
                </label>

                <label>
                    Senha
                    <div class="password">
                        <input type="password" id="loginSenha" placeholder="Senha" required>
                        <button type="button" id="btnOlho" onclick="alternarVisibilidade('loginSenha')">
                            <svg id="iconeOlho" viewBox="0 0 24 24">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                </path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </label>

                <div class="forgot-password-container">
                    <a href="#" class="forgot-password-link" onclick="esqueciSenha(event)">Esqueceu sua senha?</a>
                </div>

                <button class="login" type="submit">
                    Entrar
                </button>

            </form>

            <script>
                function alternarVisibilidade(inputId) {
                    const campo = document.getElementById(inputId);
                    const icone = document.getElementById("iconeOlho");

                    if (campo.type === "password") {
                        campo.type = "text";
                        icone.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
                    } else {
                        campo.type = "password";
                        icone.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
                    }
                }

                async function realizarLogin(event) {
                    event.preventDefault();

                    const email = document.getElementById("loginUsuario").value.trim();
                    const senha = document.getElementById("loginSenha").value;

                    try {
                        const resposta = await fetch("https://lpv-api.onrender.com/users/login", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                email: email,
                                password: senha
                            })
                        });

                        const dados = await resposta.json();

                        if (resposta.ok) {
                            const user = dados.user || {};
                            
                            // Salva todas as chaves de controle para garantir sincronia entre abas
                            localStorage.setItem("usuario", JSON.stringify(user));
                            localStorage.setItem("logado", "true");
                            localStorage.setItem("usuarioLogado", user.username || email);
                            localStorage.setItem("usuarioNome", user.username || user.nome || "Usuário");
                            localStorage.setItem("usuarioEmail", user.email || email);

                            if (dados.token) {
                                localStorage.setItem("token", dados.token);
                            }

                            alert("✅ Login realizado com sucesso!");
                            window.location.href = "../index.html";
                        } else {
                            alert("❌ E-mail ou senha incorretos.");
                        }

                    } catch (erro) {
                        console.error(erro);
                        alert("❌ Não foi possível conectar com a API.");
                    }
                }

                function esqueciSenha(event) {
                    event.preventDefault();

                    const emailCadastrado = localStorage.getItem("usuarioEmail");
                    const nomeCadastrado = localStorage.getItem("usuarioNome");

                    const emailInformado = prompt("Digite o E-MAIL cadastrado na sua conta para iniciar a recuperação:");
                    if (!emailInformado) return;

                    if (!emailCadastrado) {
                        alert("Nenhum cadastro encontrado neste navegador. Por favor, crie uma conta primeiro.");
                        return;
                    }

                    if (emailInformado.trim().toLowerCase() !== emailCadastrado.trim().toLowerCase()) {
                        alert("❌ E-mail não encontrado ou incorreto.");
                        return;
                    }

                    const codigoGerado = Math.floor(1000 + Math.random() * 9000).toString();
                    alert(`📩 [Simulação de E-mail Enviado]\n\nOlá, ${nomeCadastrado || 'Usuário'}!\nEnviamos um código para: ${emailCadastrado}\n\n👉 CÓDIGO DE VERIFICAÇÃO: ${codigoGerado}`);

                    const codigoDigitado = prompt("Digite o código de 4 dígitos enviado:");
                    if (!codigoDigitado) return;

                    if (codigoDigitado.trim() === codigoGerado) {
                        const novaSenha = prompt("✅ Código verificado!\n\nDigite a sua NOVA senha:");
                        if (novaSenha && novaSenha.length >= 4) {
                            localStorage.setItem("usuarioSenha", novaSenha);
                            alert("🎉 Senha redefinida com sucesso!");
                        }
                    } else {
                        alert("❌ Código inválido.");
                    }
                }
            </script>
        </section>

        <footer>
            <p>"Toda história começa com uma página."</p>
            <small>© 2026 Livros pra Vida</small>
        </footer>

    </main>

</body>

</html>
