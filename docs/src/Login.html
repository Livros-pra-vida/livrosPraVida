<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Livros pra Vida</title>

    <link rel="icon" type="image/png" href="../imagens/icone.png">
    <link rel="stylesheet" href="../css/StyleCadLog.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <a href="../index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
            <img src="../imagens/icone.png" alt="Logo Livros pra Vida">
            <span>Livros pra Vida</span>
        </a>
    </header>

    <main>
        <section>
            <div class="title">
                <h1>Entrar</h1>
                <p>Precisa criar uma conta? <a href="Cadastro.html">Criar conta</a></p>
            </div>

            <form id="formLogin">
                <label>
                    Nome de usuário ou e-mail
                    <input type="text" id="loginInput" required placeholder="Digite seu e-mail ou usuário" autocomplete="username">
                </label>

                <label>
                    Senha
                    <div class="password">
                        <input type="password" id="senha" required placeholder="Digite sua senha" autocomplete="current-password">
                        <button type="button" onclick="alternarVisibilidadeSenha()" aria-label="Mostrar/Ocultar Senha">
                            <svg viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </label>

                <div class="forgot-password-container">
                    <a href="#" class="forgot-password-link" onclick="alert('Instruções enviadas se o e-mail existir no sistema.')">Esqueceu sua senha?</a>
                </div>

                <button type="submit" class="login" id="btnSubmit">Entrar</button>
            </form>
        </section>

        <footer>
            <p>"Toda história começa com uma página."</p>
            <div class="benefits">
                <span>✓ Compra e Troca P2P</span>
                <span>✓ Chat em Tempo Real</span>
                <span>✓ Comunidade Literária</span>
            </div>
            <small>© 2026 Livros pra Vida. Todos os direitos reservados.</small>
        </footer>
    </main>

    <script>
         const API_URL = "https://lpv-api.onrender.com";

function alternarVisibilidadeSenha() {
    const campo = document.getElementById("senha");
    campo.type = campo.type === "password" ? "text" : "password";
}

document.getElementById("formLogin").addEventListener("submit", async function (event) {
    event.preventDefault();

    const loginValue = document.getElementById("loginInput").value.trim();
    const passwordValue = document.getElementById("senha").value;
    const btnSubmit = document.getElementById("btnSubmit");

    btnSubmit.disabled = true;
    btnSubmit.innerText = "Entrando...";

    try {
        const response = await fetch(`${API_URL}/users/login`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email: loginValue,
                password: passwordValue
            })
        });

        const data = await response.json();

        if (response.ok) {
            localStorage.setItem("logado", "true");
            localStorage.setItem("token", data.token);
            localStorage.setItem("usuarioId", data.user.id);
            localStorage.setItem("usuarioNome", data.user.username);
            localStorage.setItem("usuarioEmail", data.user.email);
            localStorage.setItem("isAdmin", data.user.admin ? "true" : "false");

            alert(`🎉 Bem-vindo(a) de volta, ${data.user.username}!`);
            window.location.href = "../index.html";
        } else {
            alert("❌ Erro ao entrar: " + (data.error || "Usuário ou senha incorretos."));
        }
    } catch (error) {
        console.error("Erro no login:", error);
        alert("❌ Não foi possível conectar ao servidor no Render.");
    } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Entrar";
    }
});
    </script>
</body>

</html>
