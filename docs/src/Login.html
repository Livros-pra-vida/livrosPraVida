<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Livros pra Vida</title>

    <link rel="icon" type="image/png" href="../imagens/icone.png">
    <link rel="stylesheet" href="../css/StyleLogin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="login-container">
        <a href="../index.html" class="logo">
            <img src="../imagens/icone.png" alt="Logo Livros pra Vida">
            <span>Livros pra Vida</span>
        </a>

        <h1>Entrar</h1>
        <p class="subtitle">Precisa criar uma conta? <a href="Cadastro.html">Criar conta</a></p>

        <form id="formLogin" onsubmit="fazerLogin(event)">
            <div class="form-group">
                <label for="loginInput">Nome de usuário ou e-mail</label>
                <input type="text" id="loginInput" required placeholder="Digite seu e-mail ou usuário" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <div class="input-password-wrapper">
                    <input type="password" id="senha" required placeholder="Digite sua senha" autocomplete="current-password">
                    <button type="button" class="btn-toggle-password" onclick="alternarVisibilidadeSenha()" aria-label="Mostrar/Ocultar Senha">
                        👁️
                    </button>
                </div>
            </div>

            <div class="form-options">
                <a href="#" class="forgot-password" onclick="alert('Instruções enviadas se o e-mail existir no sistema.')">Esqueceu sua senha?</a>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">Entrar</button>
        </form>

        <footer class="login-footer">
            <p>"Toda história começa com uma página."</p>
            <p>© 2026 Livros pra Vida</p>
        </footer>
    </div>

    <script>
        const API_URL = "https://lpv-api.onrender.com";

        function alternarVisibilidadeSenha() {
            const campo = document.getElementById("senha");
            campo.type = campo.type === "password" ? "text" : "password";
        }

        async function fazerLogin(event) {
            event.preventDefault();

            const loginValue = document.getElementById("loginInput").value.trim();
            const passwordValue = document.getElementById("senha").value;
            const btnSubmit = document.getElementById("btnSubmit");

            btnSubmit.disabled = true;
            btnSubmit.innerText = "Entrando...";

            try {
                const response = await fetch(`${API_URL}/users/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        login: loginValue,
                        password: passwordValue
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem("logado", "true");
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("usuarioId", data.user.id);
                    localStorage.setItem("usuarioNome", data.user.username);
                    localStorage.setItem("usuarioEmail", data.user.email);
                    localStorage.setItem("isAdmin", data.user.admin ? "true" : "false");

                    if (data.user.avatar_url) {
                        localStorage.setItem("usuarioFoto", data.user.avatar_url);
                    }

                    alert(`🎉 Bem-vindo(a) de volta, ${data.user.username}!`);
                    window.location.href = "../index.html";
                } else {
                    alert("❌ Erro ao entrar: " + (data.error || "Usuário ou senha incorretos."));
                }
            } catch (error) {
                console.error("Erro no login:", error);
                alert("❌ Não foi possível conectar ao servidor no Render. Verifique a API.");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Entrar";
            }
        }
    </script>
</body>

</html>
