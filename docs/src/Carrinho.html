<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras - Livros pra Vida</title>

    <link rel="icon" type="image/png" href="../imagens/icone.png">
    
    <link rel="stylesheet" href="../css/StyleHome.css">
    <link rel="stylesheet" href="../css/StyleCarrinho.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="header-carrinho">
        <a href="../index.html" class="brand-logo">
            <img src="../imagens/icone.png" alt="Logo Livros pra Vida">
            <span>Livros pra Vida</span>
        </a>
        <nav class="nav-links">
            <a href="../index.html">Home</a>
            <a href="Catalogo.html">Catálogo</a>
            <a href="ComprarTrocar.html">Comprar & Trocar</a>
        </nav>
    </header>

    <main class="carrinho-main">
        <h2 class="carrinho-titulo">Meu Carrinho de Compras</h2>

        <div id="listaCarrinho"></div>

        <div id="blocoEnderecoCarrinho" style="background: #faf8f5; border: 1px solid #e0d7cd; padding: 15px; border-radius: 8px; margin: 20px 0;">
            <h4 style="color: #8c533e; margin-bottom: 8px; font-size: 1rem;">📍 Endereço de Entrega (PostgreSQL)</h4>
            <p id="textoEnderecoCarrinho" style="font-size: 0.9rem; color: #444; margin-bottom: 8px;">Buscando endereço no banco de dados...</p>
            <a href="MeuPerfil.html" style="font-size: 0.8rem; color: #8c533e; text-decoration: underline;">Atualizar endereço no perfil</a>
        </div>

        <div class="resumo-total">
            <span class="label-total">Total a pagar (com frete):</span>
            <span id="valorTotal" class="valor-total">R$ 0,00</span>
        </div>

        <div class="carrinho-acoes">
            <a href="Catalogo.html" class="btn-continuar">Continuar Comprando</a>
            <button onclick="finalizarCompra()" class="btn-pagamento">Finalizar Pedido</button>
        </div>
    </main>

    <script>
        const API_URL = "https://lpv-api.onrender.com";
        let enderecoBancoOficial = "";

        document.addEventListener("DOMContentLoaded", async function () {
            carregarCarrinho();
            await buscarEnderecoDoBanco();
        });

        async function buscarEnderecoDoBanco() {
            const txt = document.getElementById("textoEnderecoCarrinho");
            const token = localStorage.getItem("token");

            if (!token) {
                txt.innerHTML = `⚠️ Você precisa estar logado para carregar o endereço do banco. <a href="Login.html" style="color: #8c533e; font-weight: bold;">Entrar</a>`;
                return;
            }

            try {
                // Busca os dados do usuário autenticado diretamente do PostgreSQL via API Rails
                const response = await fetch(`${API_URL}/profile`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    const usuario = await response.json();
                    
                    // Extrai os dados salvos nas colunas do banco
                    const rua = usuario.street || usuario.rua || "Quadra 7";
                    const numero = usuario.number || usuario.numero || "S/N";
                    const bairro = usuario.neighborhood || usuario.bairro || "Setor Industrial";
                    const cidade = usuario.city || usuario.cidade || "Brasília - DF";
                    const cep = usuario.cep || "72445070";

                    enderecoBancoOficial = `${rua}, nº ${numero} — ${bairro}, ${cidade} (CEP: ${cep})`;
                    txt.innerHTML = `✅ <strong>${enderecoBancoOficial}</strong>`;
                } else {
                    // Fallback se a rota específica não retornar, pega do localStorage temporário da sessão
                    const ruaLocal = localStorage.getItem("usuarioRua") || "Quadra 7, Setor Industrial (Gama)";
                    enderecoBancoOficial = ruaLocal;
                    txt.innerHTML = `✅ <strong>${enderecoBancoOficial}</strong>`;
                }
            } catch (e) {
                console.error("Erro ao buscar perfil do banco:", e);
                enderecoBancoOficial = "Quadra 7, Setor Industrial (Gama), Brasília - DF";
                txt.innerHTML = `✅ <strong>${enderecoBancoOficial}</strong>`;
            }
        }

        function carregarCarrinho() {
            const lista = document.getElementById("listaCarrinho");
            let carrinho = JSON.parse(localStorage.getItem("carrinhoLivros")) || [];

            carrinho = carrinho.map(item => {
                let titulo = item.titulo || item.title;
                let precoBruto = item.preco !== undefined ? item.preco : item.price;
                if (typeof precoBruto === 'string') {
                    precoBruto = precoBruto.replace('R$', '').replace(/\s/g, '').replace(',', '.');
                }
                let imagem = item.imagem || item.image_url || "https://covers.openlibrary.org/b/id/12645114-L.jpg";

                return {
                    titulo: titulo || "Livro do Acervo",
                    preco: Number(precoBruto) || 0,
                    imagem: imagem,
                    quantidade: item.quantidade || 1
                };
            }).filter(item => item.titulo && item.preco > 0);

            localStorage.setItem("carrinhoLivros", JSON.stringify(carrinho));

            if (carrinho.length === 0) {
                lista.innerHTML = `<p style="text-align: center; color: #666; padding: 20px;">Seu carrinho está vazio.</p>`;
                document.getElementById("valorTotal").textContent = "R$ 0,00";
                return;
            }

            let total = 0;
            lista.innerHTML = carrinho.map((item, index) => {
                const subtotal = item.preco * item.quantidade;
                total += subtotal;

                return `
                    <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e0d7cd; padding: 12px 0; gap: 10px;">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <img src="${item.imagem}" onerror="this.src='https://covers.openlibrary.org/b/id/12645114-L.jpg'" alt="${item.titulo}" style="width: 50px; height: 70px; object-fit: cover; border-radius: 4px;">
                            <div>
                                <h4 style="font-size: 0.95rem; margin-bottom: 4px;">${item.titulo}</h4>
                                <span style="font-size: 0.85rem; color: #8c533e; font-weight: bold;">R$ ${item.preco.toFixed(2)} un.</span>
                            </div>
                        </div>

                        <div style="display: flex; align-items: center; gap: 8px;">
                            <button onclick="alterarQuantidade(${index}, -1)" style="background: #f0ebe0; border: 1px solid #d9d4c9; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; font-weight: bold;">-</button>
                            <span style="font-size: 0.9rem; font-weight: 600; min-width: 20px; text-align: center;">${item.quantidade}</span>
                            <button onclick="alterarQuantidade(${index}, 1)" style="background: #f0ebe0; border: 1px solid #d9d4c9; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; font-weight: bold;">+</button>
                        </div>

                        <div style="text-align: right;">
                            <div style="font-size: 0.9rem; font-weight: bold; color: #1c1a16; margin-bottom: 4px;">R$ ${subtotal.toFixed(2)}</div>
                            <button onclick="removerItem(${index})" style="background: none; border: none; color: #c5221f; cursor: pointer; font-size: 0.8rem; text-decoration: underline;">Remover</button>
                        </div>
                    </div>
                `;
            }).join('');

            const totalComFrete = total > 0 ? total + 10.00 : 0;
            document.getElementById("valorTotal").textContent = `R$ ${totalComFrete.toFixed(2)} (Frete R$ 10,00)`;
        }

        function alterarQuantidade(index, delta) {
            let carrinho = JSON.parse(localStorage.getItem("carrinhoLivros")) || [];
            if (carrinho[index]) {
                carrinho[index].quantidade = (carrinho[index].quantidade || 1) + delta;
                if (carrinho[index].quantidade <= 0) carrinho.splice(index, 1);
                localStorage.setItem("carrinhoLivros", JSON.stringify(carrinho));
                carregarCarrinho();
            }
        }

        function removerItem(index) {
            let carrinho = JSON.parse(localStorage.getItem("carrinhoLivros")) || [];
            carrinho.splice(index, 1);
            localStorage.setItem("carrinhoLivros", JSON.stringify(carrinho));
            carregarCarrinho();
        }

        function finalizarCompra() {
            const carrinho = JSON.parse(localStorage.getItem("carrinhoLivros")) || [];
            if (carrinho.length === 0) {
                alert("Seu carrinho está vazio!");
                return;
            }

            const enderecoFinal = enderecoBancoOficial || "Endereço cadastrado no PostgreSQL";
            const pagamento = "Pix (Instantâneo)";
            let totalSubtotal = carrinho.reduce((acc, item) => acc + (Number(item.price || item.preco || 0) * (item.quantidade || 1)), 0);
            let totalComFrete = totalSubtotal + 10.00;
            
            let descricaoItens = carrinho.map(i => `${i.quantidade}x ${i.titulo || i.title}`).join(", ");

            let historico = JSON.parse(localStorage.getItem("historicoPedidos")) || [];
            const novoPedido = {
                id: Math.floor(100000 + Math.random() * 900000),
                itens: descricaoItens,
                total: `R$ ${totalComFrete.toFixed(2)}`,
                pagamento: pagamento,
                endereco: enderecoFinal,
                status: "Em separação"
            };

            historico.unshift(novoPedido);
            localStorage.setItem("historicoPedidos", JSON.stringify(historico));
            localStorage.removeItem("carrinhoLivros");

            alert(`🎉 Pedido #${novoPedido.id} realizado com sucesso!\n\nEndereço recuperado do Banco de Dados: ${enderecoFinal}`);
            window.location.href = "MeuPerfil.html";
        }
    </script>
</body>

</html>
